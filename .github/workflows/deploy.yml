name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
        working-directory: ./web

      - name: Copy presentaciones assets to public
        run: |
          cp -r ../presentaciones ./public/presentaciones
          cp -r ../presentaciones_html ./public/presentaciones_html
        working-directory: ./web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Export data from SQLite to JSON for Astro
        run: python scripts/export_data_for_web.py
        working-directory: .

      - name: Build site
        run: |
          # Excluir el panel de administración del build estático de GitHub Pages.
          rm -rf ./src/pages/admin ./src/pages/admin.astro
          npm run build
        working-directory: ./web
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/CCE-M5/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cc5m5.github.io' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
