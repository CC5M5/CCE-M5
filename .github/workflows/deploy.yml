name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 libfreetype6 libgdk-pixbuf-2.0-0 \
            libffi8 libpq5 curl ca-certificates fonts-dejavu-core
          fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i '/^-e git+/d' requirements.lock.txt
          python -m pip install -r requirements.lock.txt

      - name: Set up runtime data from seeds
        run: |
          mkdir -p data presentaciones_html
          cp data/seeds/db.empty.sqlite3 data/db.sqlite3
          touch presentaciones_html/.gitkeep

      - name: Lint with ruff
        run: ruff check .
        env:
          PYTHONPATH: "src:scripts:."

      - name: Run tests with pytest
        run: |
          set -o pipefail
          PYTHONPATH=src:scripts:. pytest -q --tb=long 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 1

      - name: Verify seed is canonical and up to date
        run: python scripts/seed_sync.py --check
        env:
          PYTHONPATH: "src:scripts:."

  build:
    needs: lint-and-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: ./web/package-lock.json

      - name: Install Node dependencies
        timeout-minutes: 20
        run: npm ci
        working-directory: ./web

      - name: Set up runtime data from seeds
        run: |
          mkdir -p data presentaciones_html
          cp data/seeds/db.empty.sqlite3 data/db.sqlite3
          # Asegurar que presentaciones_html existe aunque esté vacío (no versionado)
          touch presentaciones_html/.gitkeep

      - name: Copy presentaciones assets to public
        run: |
          mkdir -p ./public/presentaciones ./public/presentaciones_html
          if [ -d ../presentaciones ] && [ "$(ls -A ../presentaciones)" ]; then
            cp -r ../presentaciones/* ./public/presentaciones/
          fi
          if [ -d ../presentaciones_html ] && [ "$(ls -A ../presentaciones_html)" ]; then
            cp -r ../presentaciones_html/* ./public/presentaciones_html/
          fi
        working-directory: ./web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i '/^-e git+/d' requirements.lock.txt
          python -m pip install -r requirements.lock.txt

      - name: Export data from SQLite to JSON for Astro
        run: |
          python scripts/export_data_for_web.py --project-dir ${{ github.workspace }}
        working-directory: .

      - name: Build site
        run: |
          # Excluir el panel de administración del build estático de GitHub Pages.
          rm -rf ./src/pages/admin ./src/pages/admin.astro
          # Asegurar que npm run sync usa el mismo Python que setup-python.
          export PYTHON="$(which python)"
          export PATH="$(dirname "$PYTHON"):$PATH"
          npm run build
        working-directory: ./web
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/CCE-M5/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cc5m5.github.io' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
