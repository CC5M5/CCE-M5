services:
  cce-m5:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
      - "4323:4323"
    volumes:
      # Datos de runtime y assets generados (persisten fuera del contenedor).
      - ./data:/app/data
      - ./backups:/app/backups
      - ./assets:/app/assets
      - ./presentaciones_html:/app/presentaciones_html
      # Web estática: se sirve desde el host si existe build local; en
      # producción la imagen ya incluye web/dist copiado desde el stage builder.
      - ./web/dist:/app/web/dist:ro
    environment:
      - CCE_PROJECT_DIR=/app
      - CCE_ADMIN_HOST=0.0.0.0
      - CCE_ADMIN_PORT=4323
      - EDITOR_ACORDES_HOST=0.0.0.0
      - EDITOR_ACORDES_PORT=4322
      - EDITOR_HOST=0.0.0.0
      - EDITOR_PORT=4324
      - HEALTHCHECK_NOTIFY_CHANNEL=${HEALTHCHECK_NOTIFY_CHANNEL:-}
      - HEALTHCHECK_NOTIFY_TARGET=${HEALTHCHECK_NOTIFY_TARGET:-}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/app/scripts/healthcheck_docker.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
