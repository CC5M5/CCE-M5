<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administrador · CCE M5</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1e293b;
      }
      .card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        padding: 2rem;
        width: 100%;
        max-width: 380px;
      }
      .header { text-align: center; margin-bottom: 1.5rem; }
      .header h1 { margin: 0.5rem 0 0; font-size: 1.5rem; }
      .header p { margin: 0.25rem 0 0; color: #64748b; font-size: 0.875rem; }
      .form-group { margin-bottom: 1rem; }
      label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.35rem; color: #334155; }
      input {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        font-size: 1rem;
      }
      input:focus { outline: none; border-color: #1e5631; box-shadow: 0 0 0 3px rgba(30,86,49,0.1); }
      button {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 0.5rem;
        background: #1e5631;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #164226; }
      button:disabled { opacity: 0.7; cursor: wait; }
      .error {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 0.5rem;
        background: #fef2f2;
        color: #991b1b;
        font-size: 0.875rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div style="font-size:2.5rem;">🎵</div>
        <h1>Panel de administración</h1>
        <p>CCE M5 · Generación de presentaciones</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" required placeholder="rafael.torres" />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••" />
        </div>
        <button type="submit" id="submit-btn">Entrar</button>
      </form>
      <div id="error" class="error"></div>
    </div>

    <script>
      const API_BASE = window.location.origin.replace(':4321', ':4324');
      const form = document.getElementById('login-form');
      const error = document.getElementById('error');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Entrando...';
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error de autenticación');
          localStorage.setItem('cce_admin_token', data.access_token);
          localStorage.setItem('cce_admin_user', JSON.stringify({
            username: document.getElementById('username').value,
            role: data.role,
            full_name: data.full_name,
          }));
          window.location.href = '/admin/';
        } catch (err) {
          error.textContent = err.message;
          error.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      });
    </script>
  </body>
</html>
