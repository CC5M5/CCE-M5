<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canción con acordes</title>
<style>
.cancion-con-acordes {
    font-family: "Courier New", Courier, monospace;
    line-height: 1.6;
    white-space: pre;
}
.bloque-acordes-letra {
    position: relative;
    margin-bottom: 0.2em;
}
.linea-acordes {
    position: relative;
    height: 1.2em;
}
.acorde {
    position: absolute;
    top: 0;
    color: #c0392b;
    font-weight: bold;
}
.linea-letra {
    color: #2c3e50;
}
.seccion {
    font-weight: bold;
    margin-top: 1em;
    color: #2980b9;
}
</style>
</head>
<body>
<div class="cancion-con-acordes">
<div class="letra-solo">PREPARAD EL CAMINO</div>
<div class="letra-solo">escuchar</div>
<div class="linea-vacia"></div>
<div class="bloque-acordes-letra">
  <div class="linea-acordes">
    <span class="acorde" style="left:0ch">Sol</span>
    <span class="acorde" style="left:6ch">Lam</span>
    <span class="acorde" style="left:17ch">Sim</span>
    <span class="acorde" style="left:37ch">Do</span>
    <span class="acorde" style="left:49ch">Re7</span>
  </div>
  <div class="linea-letra">PREPARAD EL CAMINO AL SEÑOR                         </div>
</div>
<div class="bloque-acordes-letra">
  <div class="linea-acordes">
    <span class="acorde" style="left:0ch">Sol</span>
    <span class="acorde" style="left:15ch">Lam</span>
    <span class="acorde" style="left:30ch">Sim</span>
    <span class="acorde" style="left:41ch">Do</span>
    <span class="acorde" style="left:46ch">Re7</span>
    <span class="acorde" style="left:52ch">Sol</span>
  </div>
  <div class="linea-letra">Y ESCUCHAD LA PALABRA DE DIOS.(Bis)                    </div>
</div>
<div class="bloque-acordes-letra">
  <div class="linea-acordes">
    <span class="acorde" style="left:0ch">Sol</span>
    <span class="acorde" style="left:4ch">Mim</span>
  </div>
  <div class="linea-letra">Voz que clama en el desierto:</div>
</div>
</div>
</body>
</html>
